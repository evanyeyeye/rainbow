name: CI

# Build + test checks that run BEFORE merge, so packaging breaks (e.g. the
# flat-layout discovery failure that only surfaced at release time) and test
# regressions block the PR instead of the release. The full cross-platform
# wheel matrix still runs only on a version tag, in publish.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (compiles the optional accelerator)
        run: python -m pip install -e .[test]
      - name: Run unit tests
        run: python -m pytest -v

  conformance:
    # The ASM conformance and ontology suites are opt-in: they fetch the
    # published Allotrope schemas and the AFO ontology over the network, so
    # they cannot run in the matrix above. Without this job they skip on every
    # PR, and a validator that silently checks nothing (which is exactly what
    # happened for a whole release cycle, for want of rfc3339-validator) would
    # go unnoticed again. Kept as its own job because it needs the network.
    #
    # It is NOT allowed to fail. continue-on-error at the job level cannot tell
    # an outage at purl.allotrope.org or EBI from a document that stopped
    # conforming, so it forgave both, which makes a green tick on this job mean
    # nothing. Instead the fetch is separated from everything around it, and
    # only being unable to reach the server skips the suites.
    #
    # Two things are deliberately NOT forgiven, because neither is an outage.
    # Reading the endpoints out of the suites is its own step that must
    # succeed: renaming _BASE or _REVISION breaks the extraction, and forgiving
    # that left the job green while nothing was checked. And an HTTP answer in
    # the 4xx range is an answer: a revision bump pointing at a schema that
    # does not exist returns 404, which means the suites cannot validate
    # against what they claim to, not that Allotrope is down.
    name: ASM conformance (network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install with the validation extra
        run: python -m pip install -e .[test,validate]
      - name: Check the date-time format checker is really registered
        # A missing rfc3339-validator makes the suite skip rather than fail, so
        # assert it is present here instead of trusting a green skip.
        run: |
          python -c "
          from jsonschema import FormatChecker
          assert 'date-time' in FormatChecker().checkers, \
              'date-time format checker not registered'
          print('date-time format checker registered')
          "
      - name: Read the schema and ontology endpoints
        # Not forgiven. The endpoints are read out of the suites themselves so
        # that bumping the ADM revision cannot leave this job probing the old
        # one and reporting reachable for a schema nothing validates against -
        # which only works if a rename that breaks the extraction fails here
        # rather than being taken for an outage.
        run: |
          set -euo pipefail
          python - <<'PY' > urls.txt
          import re
          schema = open("tests/test_asm_schema.py").read()
          base = re.search(r'_BASE = "([^"]+)"', schema).group(1)
          rev = re.search(r'_REVISION = "([^"]+)"', schema).group(1)
          for kind in ("liquid", "gas"):
              print(f"{base}{kind}-chromatography/{rev}/"
                    f"{kind}-chromatography.tabular.embed.schema.json")
          ontology = open("tests/test_asm_ontology.py").read()
          print(re.search(r'_OLS_BASE = "([^"]+)"',
                          ontology).group(1) + "/ontologies/afo")
          PY
          test -s urls.txt
          cat urls.txt

      - name: Check the sources are reachable
        # Always exits 0 and reports a verdict instead, so that what happens
        # next is decided by which of the three cases occurred rather than by
        # one bit that cannot tell them apart.
        id: sources
        run: |
          set -uo pipefail
          verdict=ok
          while read -r url; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' \
                     --retry 3 --retry-delay 5 --max-time 60 "$url") || code=000
            case "$code" in
              2*) echo "ok       $code $url" ;;
              000|5*)
                echo "outage   $code $url"
                [ "$verdict" = bad-response ] || verdict=outage ;;
              *)
                echo "::error::$url returned HTTP $code. That is an answer, "\
                     "not an outage: the suites cannot validate against it."
                verdict=bad-response ;;
            esac
          done < urls.txt
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      - name: Fail on a source that answered but not with a schema
        if: steps.sources.outputs.verdict == 'bad-response'
        run: exit 1

      - name: Report an unreachable source
        if: steps.sources.outputs.verdict == 'outage'
        run: |
          echo "::warning::Allotrope or EBI unreachable; the ASM conformance " \
               "and ontology suites did not run. This is not a pass."
          echo "### ASM conformance skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "The published schemas or the AFO ontology could not be " \
               "fetched, so nothing was validated." >> "$GITHUB_STEP_SUMMARY"

      - name: Run the conformance and ontology suites
        if: steps.sources.outputs.verdict == 'ok'
        env:
          RAINBOW_TEST_ASM_SCHEMA: '1'
        run: python -m pytest -v tests/test_asm_schema.py tests/test_asm_ontology.py

  build-check:
    name: Build wheel + sdist (no publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds a Linux wheel the same way the release does. cibuildwheel
      # creates a wheelhouse/ dir in the project root, so this catches the
      # flat-layout discovery error before merge. One Python is enough to
      # exercise the packaging path; the tag build covers the full matrix.
      - name: Build wheel
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_BUILD: cp312-manylinux_x86_64

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Build + check sdist
        run: |
          python -m pip install --upgrade build twine
          python -m build --sdist
          python -m twine check dist/*
