[build-system]
requires      = ["setuptools>=63.0.0", "wheel", "Cython>=0.29.30"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbow-api"
version = "1.5.0"
description = "Read chromatography and mass spectrometry binary files"
readme = "README.md"
license = {text = "COPYING.LESSER"}
authors = [
    {name = "Evan Shi and Eugene Kwan"},
    {email = "evanyshi@cmu.edu"}
]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)"
]
# What every install needs to read a file, and nothing more. lxml is here for
# speed, not correctness: the parsers fall back to the standard library and
# reach the same answer, but rb.read_metadata is about 2.5x slower that way, so
# a default install should have it. matplotlib (plotting) and pandas (the
# Waters transition table) are neither, and are extras below.
dependencies = [
    "numpy",
    "lxml>=4.9"
]

[project.optional-dependencies]
test = ["pytest"]
# Agilent MassHunter profile data (MSProfile.bin) can carry LZF-compressed
# segments whose decode needs python-lzf. It is only imported when such a
# segment is actually encountered, so the base install stays pure-Python;
# install rainbow-api[hrms] to parse those files (read(..., hrms=True)).
hrms = ["python-lzf"]
# For the opt-in ASM schema-conformance test (see tests/test_asm_schema.py).
# jsonschema >= 4.18 pulls in the `referencing` registry used to resolve the
# Allotrope schema's cross-references.
validate = ["jsonschema>=4.18"]
# DataFile.plot draws with matplotlib. Reading a file never needs it, and it is
# the single heaviest thing rainbow can import, so it is not installed by
# default; plot() says so if it is missing.
plot = ["matplotlib"]
# The Waters compound transition table is returned as a pandas DataFrame, the
# only thing in rainbow that uses pandas.
waters = ["pandas"]

[project.urls]
Repository = "https://github.com/evanyeyeye/rainbow"
Documentation = "https://rainbow-api.readthedocs.io"

[tool.setuptools.packages.find]
# Declare the package explicitly. Without this, setuptools' flat-layout
# auto-discovery treats sibling directories (e.g. cibuildwheel's wheelhouse/,
# or tests/, docs/) as top-level packages and fails with "Multiple top-level
# packages discovered in a flat-layout".
include = ["rainbow*"]

[tool.cibuildwheel]
# Build CPython wheels for the optional compiled accelerator. The extension
# is optional, so any platform that can't compile still yields a working
# (pure-Python-fallback) wheel, and the sdist covers everything else.
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux* *_i686 *-win32"

[tool.pytest.ini_options]
# Tests are run from the repo root (fixtures are referenced as tests/inputs/...
# and the suite imports the `tests` package).
testpaths = ["tests"]
