<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <!--
    F4: a whole sequence becomes ONE ASM document: a single device system
    document (the shared instrument) plus one liquid chromatography document per
    injection, in acquisition order, each with its own measurements and peaks.
  -->
  <defs>
    <marker id="seqarrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <!-- left: DataSequence -->
  <text x="110" y="34" text-anchor="middle" font-size="14" font-style="italic" fill="#777">rainbow object</text>
  <rect x="30" y="120" width="160" height="120" rx="9" fill="#eaf3fb" stroke="#3a78b5" stroke-width="2"/>
  <text x="110" y="158" text-anchor="middle" font-size="16" font-weight="700" fill="#333">DataSequence</text>
  <text x="110" y="182" text-anchor="middle" font-size="12" fill="#3a6ea5">N injections,</text>
  <text x="110" y="200" text-anchor="middle" font-size="12" fill="#3a6ea5">one instrument</text>
  <text x="110" y="224" text-anchor="middle" font-size="11.5" font-family="monospace" fill="#777">rb.read_sequence</text>

  <!-- arrow -->
  <line x1="194" y1="180" x2="258" y2="180" stroke="#444" stroke-width="2" marker-end="url(#seqarrow)"/>
  <text x="226" y="170" text-anchor="middle" font-size="12" font-family="monospace" fill="#333">to_asm</text>

  <!-- right: one ASM document wrapping everything -->
  <text x="540" y="34" text-anchor="middle" font-size="14" font-style="italic" fill="#777">one ASM document</text>
  <rect x="270" y="48" width="530" height="350" rx="11" fill="#f3faf5" stroke="#3c9a5f" stroke-width="2"/>
  <text x="288" y="74" font-size="13.5" font-weight="700" fill="#2f6b46">liquid chromatography aggregate document</text>

  <!-- device system document (shared) -->
  <rect x="288" y="88" width="494" height="52" rx="8" fill="#eaf7ee" stroke="#3c9a5f" stroke-width="1.8"/>
  <text x="304" y="111" font-size="13.5" fill="#2f6b46">device system document</text>
  <text x="304" y="130" font-size="12" fill="#777">the shared instrument: one set of device documents for the whole run</text>

  <!-- per-injection LC documents (stack) -->
  <!-- injection N (back) -->
  <rect x="300" y="168" width="486" height="56" rx="8" fill="#dff0e6" stroke="#9bbfa8" stroke-width="1.4"/>
  <!-- injection 2 (mid) -->
  <rect x="294" y="162" width="486" height="56" rx="8" fill="#e7f4ec" stroke="#79b591" stroke-width="1.6"/>
  <!-- injection 1 (front) -->
  <rect x="288" y="156" width="486" height="56" rx="8" fill="#eaf7ee" stroke="#3c9a5f" stroke-width="1.8"/>
  <text x="304" y="178" font-size="13.5" fill="#2f6b46">liquid chromatography document, injection 1</text>
  <text x="304" y="200" font-size="12" font-family="monospace" fill="#999">measurement document [ ] · data cubes · peak list</text>

  <text x="540" y="252" text-anchor="middle" font-size="12.5" fill="#666">one liquid chromatography document per injection, in acquisition order</text>

  <!-- vertical ellipsis to N -->
  <text x="540" y="280" text-anchor="middle" font-size="18" fill="#9bbfa8">&#8942;</text>

  <!-- injection N labelled -->
  <rect x="288" y="296" width="494" height="56" rx="8" fill="#eaf7ee" stroke="#3c9a5f" stroke-width="1.8"/>
  <text x="304" y="318" font-size="13.5" fill="#2f6b46">liquid chromatography document, injection N</text>
  <text x="304" y="340" font-size="12" font-family="monospace" fill="#999">measurement document [ ] · data cubes · peak list</text>

  <text x="540" y="384" text-anchor="middle" font-size="12" fill="#777">rb.sequence_from_asm reconstructs the DataSequence from this document</text>
</svg>
